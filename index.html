<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>營養管理系統 V4.1｜Supabase 雲端版</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#263a32;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dae5dd;padding:17px max(18px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:21px;font-weight:800;color:#286b51}.sub{font-size:12px;color:#64766b}main{max-width:1140px;margin:24px auto;padding:0 16px}.layout{display:grid;grid-template-columns:245px 1fr;gap:18px}.panel{background:white;border:1px solid #dfe9e1;border-radius:15px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #23492b09}.nav button{display:block;width:100%;text-align:left;margin:7px 0}.active{background:#266b50!important;color:white!important}button{border:1px solid #cbded0;border-radius:9px;background:#fff;color:#28543f;padding:10px 13px;cursor:pointer;font-weight:650}button.primary{background:#286b50;color:white;border-color:#286b50}button.warn{color:#a44d3c;border-color:#edc9c3}button:hover{filter:brightness(.96)}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 15px}h3{font-size:15px;margin:12px 0}p{line-height:1.6}.muted{color:#6c8074;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #cbd9ce;border-radius:8px;padding:10px;font:inherit;background:white;color:#263a32}textarea{min-height:84px;resize:vertical}.field{margin-bottom:12px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e7eee8;text-align:left}th{background:#f5f8f5}td input{min-width:75px}.tag{border-radius:20px;background:#e9f4ec;color:#276a4c;padding:4px 9px;font-size:12px;white-space:nowrap}.pending{background:#fff2d7;color:#885a0b}.rejected{background:#fde7e5;color:#9a4037}.stats{font-size:25px;font-weight:800;color:#286b50}.item{border:1px solid #e2ebe4;border-radius:11px;padding:13px;margin:10px 0}.selected{border-color:#65aa7e;background:#f5fbf6}.hide{display:none!important}.notice{background:#fff8e8;border:1px solid #f1d9a7;padding:12px;border-radius:9px;font-size:13px;color:#78571c;margin:12px 0}.ok{background:#e9f6eb;border:1px solid #c3e6cc;padding:12px;border-radius:9px}.role{display:flex;gap:6px}.role button{font-size:12px}.tiny{font-size:12px}.clientlink{display:block;width:100%;margin:5px 0;text-align:left}.divider{border-top:1px solid #e4ece6;margin:16px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid,.grid3{grid-template-columns:1fr}.panel{padding:15px}header{padding:15px}.role{width:100%}}
[hidden]{display:none!important}.center{max-width:650px;margin:45px auto;padding:0 16px}.err{color:#a33}.hint{font-size:13px;color:#526a59}</style></head><body>
<div id="setup" class="center" hidden><div class="panel"><h1>V4 雲端連線設定</h1><p>請填入 Supabase 專案的公開連線資訊。不要輸入 service_role 或 secret key。</p><div class="field"><label>Project URL</label><input id="projectUrl" placeholder="https://xxxxx.supabase.co"></div><div class="field"><label>Publishable Key / anon key</label><input id="publicKey" placeholder="sb_publishable_... 或 eyJ..."></div><button class="primary" onclick="connect()">儲存設定並連線</button><p id="setupError" class="err"></p><p class="hint">設定只存在目前瀏覽器。部署時可把公開連線設定改成專案配置檔。</p></div></div>
<div id="auth" class="center" hidden><div class="panel"><h1>營養管理系統｜帳號登入</h1><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="primary" onclick="authenticate('login')">登入</button><button onclick="authenticate('signup')">註冊個案帳號</button><button onclick="clearConfig()">重新設定連線</button></div><p id="authError" class="err"></p><p class="hint">新帳號預設是個案。營養師權限必須由專案管理者在資料庫核准。</p></div></div>
<div id="app" hidden><header><div><div class="brand">🌿 營養管理系統</div><div class="sub">個案飲食日誌 × 營養師管理工作台 · V4.1 Supabase</div></div><div class="role"><button id="clientRole" onclick="switchRole('client')">個案模式</button><button id="dietRole" onclick="switchRole('dietitian')">營養師模式</button><button onclick="signOut()">登出</button></div></header><main><div class="notice">雲端測試版本。正式收集健康資訊前，請完成個案同意、權限與安全驗證、隱私政策及備份規劃。</div><div class="layout"><aside class="panel nav"><h2 id="sideTitle">功能選單</h2><div id="nav"></div><div class="divider"></div><div class="field"><label>個案</label><select id="person" onchange="setPerson(this.value)"></select></div></aside><section id="content"></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const foods=['蔬菜','全穀雜糧','低脂豆魚蛋肉','中脂豆魚蛋肉','高脂豆魚蛋肉','油脂','高蛋白','水果','乳品','其他'];
const modes=['一般日','中碳日 M+','中碳日 M','低碳日 L','高碳日 H','運動日','休息日'];
const defaultTargets=[5,11,11,3,0,4.5,1,0,0,0];
let data={clients:[],entries:[],summaries:{}},role='client',page='diary',person='',day=new Date().toLocaleDateString('en-CA');
let currentUser=null,cloud=null,profile=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const client=()=>data.clients.find(c=>c.id===person);
const entry=()=>data.entries.find(e=>e.clientId===person&&e.date===day);
const status=e=>e.status==='reviewed'?'已審核':e.status==='submitted'?'待審核':'草稿';
const tag=e=>`<span class="tag ${e.status==='submitted'?'pending':''}">${status(e)}</span>`;
const num=x=>x===''?null:Number(x);
const targetFor=(c,m)=>c?.targets?.[m]||c?.targets?.['一般日']||defaultTargets;
async function save(){throw Error('請使用雲端儲存操作');}
function switchRole(r){if(r!==profile?.role)return;role=r;page=r==='client'?'diary':'dashboard';render()}function setPerson(v){if(role==='client')return;person=v;render()}function go(p){page=p;render()}function render(){if(!client()){ $('content').innerHTML='<div class=panel>目前沒有可存取的個案資料。營養師請先完成個案授權；個案請重新登入。</div>';return;}const nav=role==='client'?[['diary','填寫每日紀錄'],['history','歷史紀錄與回饋']]:[['dashboard','個案總覽'],['review','審核與建議'],['summary','期間自動總結'],['targets','餐盤目標設定'],['manage','帳號與個案管理']];$('clientRole').className=role==='client'?'active':'';$('dietRole').className=role==='dietitian'?'active':'';$('sideTitle').textContent=role==='client'?'個案功能':'營養師後台';$('nav').innerHTML=nav.map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');$('person').disabled=role==='client';$('person').innerHTML=data.clients.map(c=>`<option value="${esc(c.id)}" ${c.id===person?'selected':''}>${esc(c.name)}</option>`).join('');if(!client()){person=data.clients[0]?.id||''}({diary:renderDiary,history:renderHistory,dashboard:renderDashboard,review:renderReview,targets:renderTargets,manage:renderManage,summary:renderSummary}[page]||renderDiary)()}
function renderDiary(){let e=entry(),m=e?.mode||'一般日',t=targetFor(client(),m);$('content').innerHTML=`<div class="panel"><h1>每日飲食紀錄</h1><p class="muted">${esc(client().name)} · 儲存草稿後可提交營養師審核。</p><div class="grid"><div class="field"><label>日期</label><input id="date" type="date" value="${day}" onchange="day=this.value;render()"></div><div class="field"><label>飲食日類型</label><select id="mode" onchange="updateMode()">${modes.map(x=>`<option ${x===m?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="tablewrap"><table><thead><tr><th>食物類別</th><th>目標份數</th><th>實際份數</th></tr></thead><tbody id="foodRows"></tbody></table></div></div><div class="panel"><h2>餐食紀錄</h2><div class="grid">${[['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['snack','點心／飲料／補充品']].map(([k,n])=>`<div class="field"><label>${n}</label><textarea id="${k}" placeholder="食物、份量、烹調方式">${esc(e?.[k]||'')}</textarea></div>`).join('')}</div></div><div class="panel"><h2>生活與活動紀錄</h2><div class="grid3">${[['weight','體重 kg'],['water','飲水 ml'],['steps','步數'],['sleep','睡眠 小時']].map(([k,n])=>`<div class="field"><label>${n}</label><input id="${k}" type="number" min="0" step="any" value="${esc(e?.[k]??'')}"></div>`).join('')}<div class="field"><label>排便</label><select id="bowel">${['未填寫','正常','便秘','腹瀉','其他'].map(x=>`<option ${x===(e?.bowel||'未填寫')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>運動</label><input id="exercise" value="${esc(e?.exercise||'')}" placeholder="項目、時間"></div></div><div class="field"><label>飢餓感、心情與其他備註</label><textarea id="notes">${esc(e?.notes||'')}</textarea></div><div class="actions"><button onclick="saveDiary(false)">儲存草稿</button><button class="primary" onclick="saveDiary(true)">提交營養師審核</button></div>${e?.status==='reviewed'?`<div class="ok"><strong>營養師回饋</strong><p>${esc(e.feedback||'')}</p><span class="tiny">審核時間：${esc(e.reviewedAt||'')}</span></div>`:e?.status==='submitted'?'<p class="muted">此紀錄已提交，等待營養師審核。</p>':''}</div>`;updateMode(false)}
function updateMode(refresh=true){let m=$('mode').value,e=entry(),t=targetFor(client(),m);$('foodRows').innerHTML=foods.map((f,i)=>`<tr><td>${f}</td><td>${t[i]??0}</td><td><input id="f${i}" type="number" min="0" step="0.1" value="${esc(refresh?'':(e?.amounts?.[i]??''))}" placeholder="未填"></td></tr>`).join('')}
async function saveDiary(submit){let old=entry(),v={clientId:person,date:day,mode:$('mode').value,amounts:foods.map((_,i)=>{let el=$('f'+i);return num(el.value)}),status:submit?'submitted':'draft',feedback:old?.feedback||'',reviewedAt:old?.reviewedAt||''};for(let k of ['breakfast','lunch','dinner','snack','weight','water','steps','sleep','bowel','exercise','notes'])v[k]=$(k).value;if(old){Object.assign(old,v)}else data.entries.push(v);try{await persistEntry(v);await loadData();alert(submit?'已提交雲端紀錄':'已儲存雲端草稿');render()}catch(err){alert('儲存失敗：'+err.message);await loadData()}}
function renderHistory(){$('content').innerHTML=`<div class="panel"><h1>歷史紀錄與回饋</h1>${data.entries.filter(e=>e.clientId===person).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="item"><strong>${esc(e.date)}</strong> · ${esc(e.mode)} ${tag(e)}<p class="muted">${esc(e.breakfast||'未填早餐')} · ${esc(e.exercise||'未填運動')}</p>${e.feedback?`<p><strong>營養師：</strong>${esc(e.feedback)}</p>`:''}<button onclick="day='${e.date}';go('diary')">查看／編輯</button></div>`).join('')||'<p class="muted">尚無紀錄。</p>'}</div>`}
function renderDashboard(){let submitted=data.entries.filter(e=>e.status==='submitted').length;let reviewed=data.entries.filter(e=>e.status==='reviewed').length;$('content').innerHTML=`<div class="panel"><h1>營養師工作台</h1><p class="muted">查看示範個案紀錄與待審核數量。</p><div class="grid3"><div><div class="stats">${data.clients.length}</div><span class="muted">個案數</span></div><div><div class="stats">${submitted}</div><span class="muted">待審核</span></div><div><div class="stats">${reviewed}</div><span class="muted">已審核</span></div></div></div><div class="panel"><h2>個案清單</h2>${data.clients.map(c=>{let es=data.entries.filter(e=>e.clientId===c.id);return `<div class="item"><strong>${esc(c.name)}</strong><p class="muted">紀錄 ${es.length} 筆 · 待審核 ${es.filter(e=>e.status==='submitted').length} 筆</p><button onclick="person='${c.id}';go('review')">查看紀錄</button> <button onclick="person='${c.id}';go('targets')">設定餐盤</button></div>`}).join('')}</div>`}
function renderReview(){let es=data.entries.filter(e=>e.clientId===person).sort((a,b)=>b.date.localeCompare(a.date));$('content').innerHTML=`<div class="panel"><h1>審核與營養建議</h1><p class="muted">目前個案：${esc(client().name)}</p>${es.map((e,i)=>`<div class="item"><strong>${esc(e.date)}</strong> · ${esc(e.mode)} ${tag(e)}<div class="actions"><button onclick="openReview('${e.date}')">查看與回覆</button></div></div>`).join('')||'<p class="muted">這位個案尚無紀錄。</p>'}</div><div id="reviewDetail"></div>`}
function openReview(d){let e=data.entries.find(x=>x.clientId===person&&x.date===d),t=targetFor(client(),e.mode);$('reviewDetail').innerHTML=`<div class="panel"><h2>${esc(d)} · 營養分析</h2><div class="tablewrap"><table><thead><tr><th>食物</th><th>目標</th><th>實際</th><th>差異</th></tr></thead><tbody>${foods.map((f,i)=>{let v=e.amounts?.[i];return `<tr><td>${f}</td><td>${t[i]??0}</td><td>${v==null?'未填':v}</td><td>${v==null?'—':Math.round((v-(t[i]||0))*10)/10}</td></tr>`}).join('')}</tbody></table></div><h3>飲食與生活</h3><p>${[['早餐',e.breakfast],['午餐',e.lunch],['晚餐',e.dinner],['點心',e.snack],['運動',e.exercise],['體重',e.weight],['水量',e.water],['步數',e.steps],['睡眠',e.sleep],['排便',e.bowel],['備註',e.notes]].map(([k,v])=>`<strong>${k}：</strong>${esc(v||'未填')}`).join('<br>')}</p><div class="field"><label>營養師建議</label><textarea id="feedback" placeholder="輸入具體的營養建議">${esc(e.feedback||'')}</textarea></div><div class="actions"><button class="primary" onclick="finishReview('${d}')">儲存建議並標記已審核</button><button onclick="copyReview('${d}')">複製紀錄摘要</button></div></div>`;$('reviewDetail').scrollIntoView({behavior:'smooth',block:'start'})}
async function finishReview(d){let e=data.entries.find(x=>x.clientId===person&&x.date===d);e.feedback=$('feedback').value.trim();e.status='reviewed';e.reviewedAt=new Date().toLocaleString('zh-TW');try{await persistEntry(e);await loadData();renderReview();openReview(d)}catch(err){alert('審核失敗：'+err.message);await loadData()}}function copyReview(d){let e=data.entries.find(x=>x.clientId===person&&x.date===d);let s=`${client().name}｜${d}\n${foods.map((f,i)=>`${f}: ${e.amounts?.[i]??'未填'}份`).join('\n')}\n營養建議：${$('feedback').value}`;navigator.clipboard?.writeText(s).then(()=>alert('已複製')).catch(()=>prompt('請手動複製',s))}
function renderTargets(){let c=client();$('content').innerHTML=`<div class="panel"><h1>個人化餐盤設定</h1><p class="muted">${esc(c.name)}：依不同碳循環日設定十種食物的份數目標。</p><div class="field"><label>餐盤類型</label><select id="targetMode" onchange="showTargetRows()">${modes.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>食物類別</th><th>目標份數</th></tr></thead><tbody id="targetRows"></tbody></table></div><div class="actions"><button class="primary" onclick="saveTargets()">儲存目標</button></div></div>`;showTargetRows()}
function showTargetRows(){let t=targetFor(client(),$('targetMode').value);$('targetRows').innerHTML=foods.map((f,i)=>`<tr><td>${f}</td><td><input id="t${i}" type="number" min="0" step="0.1" value="${t[i]??0}"></td></tr>`).join('')}async function saveTargets(){let a=foods.map((_,i)=>Number($('t'+i).value));if(a.some(x=>!Number.isFinite(x)||x<0)){alert('請輸入有效非負數');return}client().targets[$('targetMode').value]=a;try{await persistTargets();alert('餐盤目標已儲存到雲端')}catch(err){alert('儲存失敗：'+err.message);await loadData()}}
function renderManage(){ $('content').innerHTML=`<div class="panel"><h1>個案管理</h1><p>目前登入：${esc(currentUser?.email)}</p><p>新增個案流程：請個案先自行註冊；營養師在 Supabase SQL Editor 依 README 的安全管理指令綁定個案。前端不提供直接提升管理員權限。</p><p class="muted">目前已授權個案 ${data.clients.length} 位。</p><button onclick="signOut()">登出</button></div>`;}
function download(name,content,type){let blob=new Blob(['\ufeff',content],{type});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const dateShift=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const avg=(a)=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fmt=(n,d=1)=>n===null?'—':Number(n.toFixed(d)).toLocaleString('zh-TW',{maximumFractionDigits:d});
const numeric=(e,k)=>e[k]!==''&&e[k]!=null&&Number.isFinite(Number(e[k]))?Number(e[k]):null;
function summaryEntries(){return data.entries.filter(e=>e.clientId===person&&e.date>=summaryStart&&e.date<=summaryEnd).sort((a,b)=>a.date.localeCompare(b.date))}
function summaryStats(es){return ['weight','water','steps','sleep'].map(k=>{let vals=es.map(e=>numeric(e,k)).filter(x=>x!==null);return {key:k,mean:avg(vals),count:vals.length,first:vals[0]??null,last:vals.at(-1)??null}})}
function foodStats(es){return foods.map((f,i)=>{let pairs=es.map(e=>({v:e.amounts?.[i],t:targetFor(client(),e.mode)[i]})).filter(x=>x.v!==null&&x.v!==undefined&&Number.isFinite(Number(x.v)));return {name:f,count:pairs.length,actual:avg(pairs.map(x=>Number(x.v))),target:avg(pairs.map(x=>Number(x.t)||0)),diff:avg(pairs.map(x=>Number(x.v)-(Number(x.t)||0)))}})}
function reportText(){let es=summaryEntries(),ss=summaryStats(es),fs=foodStats(es),lines=[`${client().name}｜營養期間總結`,`${summaryStart} ～ ${summaryEnd}`,`紀錄天數：${es.length} 天`,`已審核：${es.filter(e=>e.status==='reviewed').length} 天｜待審核：${es.filter(e=>e.status==='submitted').length} 天｜草稿：${es.filter(e=>e.status==='draft').length} 天`,'','【食物份數｜實際日均 / 對應目標日均 / 差異】',...fs.map(f=>`${f.name}：${fmt(f.actual)} / ${fmt(f.target)} / ${fmt(f.diff)} 份（有紀錄 ${f.count} 天）`),'','【生活指標】',...ss.map((v,i)=>`${['體重 kg','飲水 ml','步數','睡眠 小時'][i]}：平均 ${fmt(v.mean)}（${v.count} 天有填）${i===0&&v.count>=2?'；首末有紀錄差異 '+fmt(v.last-v.first)+' kg':''}`),'','【運動】',...es.map(e=>`${e.date}：${e.exercise?.trim()||'未填'}`),'','【排便】',...es.map(e=>`${e.date}：${e.bowel&&e.bowel!=='未填寫'?e.bowel:'未填'}`),'','【每日餐食與備註】',...es.map(e=>`${e.date}（${e.mode}｜${status(e)}）\n早餐：${e.breakfast||'未填'}\n午餐：${e.lunch||'未填'}\n晚餐：${e.dinner||'未填'}\n點心：${e.snack||'未填'}\n其他：${e.notes||'未填'}`),'','【營養師每日建議】',...es.map(e=>`${e.date}：${e.feedback?.trim()||'尚無建議'}`),'','【期間營養師總結】',data.summaries?.[`${person}|${summaryStart}|${summaryEnd}`]||'尚未撰寫'];return lines.join('\n')}
function renderSummary(){if(!summaryEnd){summaryEnd=day;summaryStart=dateShift(day,-6)}let es=summaryEntries(),ss=summaryStats(es),fs=foodStats(es),key=`${person}|${summaryStart}|${summaryEnd}`,written=data.summaries?.[key]||'';
$('content').innerHTML=`<div class="panel"><h1>${role==='client'?'我的期間總結':'個案期間自動總結'}</h1><p class="muted">${esc(client().name)} · 依已儲存紀錄彙整，未填欄位不列入平均；目標依當天餐盤類型計算。草稿也會計入，請留意狀態。</p><div class="grid"><div class="field"><label>開始日期</label><input type="date" id="sumStart" value="${summaryStart}"></div><div class="field"><label>結束日期</label><input type="date" id="sumEnd" value="${summaryEnd}"></div></div><div class="actions"><button class="primary" onclick="applySummaryRange()">更新彙整</button><button onclick="copySummary()">複製完整總結</button><button onclick="downloadSummary()">下載 TXT</button></div></div>
<div class="panel"><h2>紀錄概況</h2><div class="grid3"><div><div class="stats">${es.length}</div><span class="muted">紀錄天數</span></div><div><div class="stats">${es.filter(e=>e.status==='reviewed').length}</div><span class="muted">已審核</span></div><div><div class="stats">${es.filter(e=>e.status==='submitted').length}</div><span class="muted">待審核</span></div></div><p class="muted">草稿 ${es.filter(e=>e.status==='draft').length} 筆；同一天只計一筆紀錄。</p></div>
<div class="panel"><h2>食物份數：期間日均</h2><div class="tablewrap"><table><thead><tr><th>類別</th><th>實際</th><th>目標</th><th>差異</th><th>填寫天數</th></tr></thead><tbody>${fs.map(f=>`<tr><td>${esc(f.name)}</td><td>${fmt(f.actual)}</td><td>${fmt(f.target)}</td><td>${fmt(f.diff)}</td><td>${f.count}</td></tr>`).join('')}</tbody></table></div><p class="muted">差異 = 實際 − 當日目標；負數代表低於目標，不等於臨床判定攝取不足。</p></div>
<div class="panel"><h2>生活指標</h2><div class="tablewrap"><table><thead><tr><th>指標</th><th>平均</th><th>有填天數</th><th>首筆</th><th>末筆</th></tr></thead><tbody>${ss.map((v,i)=>`<tr><td>${['體重 (kg)','飲水 (ml)','步數','睡眠 (小時)'][i]}</td><td>${fmt(v.mean)}</td><td>${v.count}</td><td>${fmt(v.first)}</td><td>${fmt(v.last)}</td></tr>`).join('')}</tbody></table></div><p class="muted">體重首末筆為期間內有填寫的最早／最晚紀錄，不一定是期間起訖日。</p></div>
<div class="panel"><h2>運動、排便與每日營養建議</h2>${es.map(e=>`<div class="item"><strong>${esc(e.date)}</strong> · ${esc(e.mode)} ${tag(e)}<p><strong>運動：</strong>${esc(e.exercise||'未填')}　<strong>排便：</strong>${esc(e.bowel&&e.bowel!=='未填寫'?e.bowel:'未填')}</p><p><strong>體重：</strong>${esc(e.weight||'未填')} kg　<strong>水量：</strong>${esc(e.water||'未填')} ml　<strong>睡眠：</strong>${esc(e.sleep||'未填')} 小時</p><p><strong>早餐：</strong>${esc(e.breakfast||'未填')}　<strong>午餐：</strong>${esc(e.lunch||'未填')}　<strong>晚餐：</strong>${esc(e.dinner||'未填')}　<strong>點心：</strong>${esc(e.snack||'未填')}</p><p><strong>備註：</strong>${esc(e.notes||'未填')}</p><p><strong>營養師建議：</strong>${esc(e.feedback||'尚無建議')}</p></div>`).join('')||'<p class="muted">所選期間沒有紀錄。</p>'}</div>
<div class="panel"><h2>期間營養師總結</h2><p class="muted">自動彙整數據後，由營養師撰寫或修訂專業建議。</p><textarea id="periodNote" ${role==='client'?'readonly':''} placeholder="本週整體表現、需要調整的方向、下週目標...">${esc(written)}</textarea>${role==='dietitian'?'<div class="actions"><button class="primary" onclick="savePeriodNote()">儲存期間總結</button></div>':''}</div>`}
function applySummaryRange(){let a=$('sumStart').value,b=$('sumEnd').value;if(!a||!b||a>b)return alert('請輸入有效日期區間');summaryStart=a;summaryEnd=b;renderSummary()}
async function savePeriodNote(){data.summaries??={};data.summaries[`${person}|${summaryStart}|${summaryEnd}`]=$('periodNote').value;try{await persistSummary();alert('期間總結已儲存到雲端');renderSummary()}catch(err){alert('儲存失敗：'+err.message);await loadData()}}
function copySummary(){let s=reportText();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('已複製完整總結')).catch(()=>prompt('請手動複製',s));else prompt('請手動複製',s)}
function downloadSummary(){download(`nutrition-summary-${person}-${summaryStart}-${summaryEnd}.txt`,reportText(),'text/plain;charset=utf-8')}

render();


const CONFIG_KEY='nutrition_v4_public_config';
function getConfig(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{return null}}
async function connect(){let url=$('projectUrl').value.trim(),key=$('publicKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)||!key){alert('請輸入正確 Project URL 和 Publishable Key');return;}localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));location.reload()}
async function init(){let c=getConfig();if(!c){$('setup').hidden=false;return;}try{cloud=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session},error}=await cloud.auth.getSession();if(error)throw error;if(session)await loggedIn(session.user);else $('auth').hidden=false;cloud.auth.onAuthStateChange((_event,session)=>{if(!session){currentUser=null;$('app').hidden=true;$('auth').hidden=false;}})}catch(err){$('setup').hidden=false;$('setupError').textContent=err.message}}
async function authenticate(mode){let email=$('email').value.trim(),password=$('password').value;if(!email||password.length<8){alert('請輸入 Email 和至少 8 字元的密碼');return;}let res=mode==='signup'?await cloud.auth.signUp({email,password}):await cloud.auth.signInWithPassword({email,password});if(res.error){alert(res.error.message);return;}if(res.data.session)await loggedIn(res.data.user);else alert('註冊完成，請依 Supabase 設定完成 Email 驗證後再登入。')}
async function loggedIn(user){currentUser=user;$('auth').hidden=true;try{let {data:p,error}=await cloud.from('profiles').select('id,display_name,role').eq('id',user.id).single();if(error)throw error;profile=p;role=p.role;await loadData();$('app').hidden=false;$('clientRole').hidden=role!=='client';$('dietRole').hidden=role!=='dietitian';page=role==='client'?'diary':'dashboard';render();}catch(err){$('auth').hidden=false;$('authError').textContent='載入失敗：'+err.message}}
async function loadData(){let [{data:profiles,error:pe},{data:rows,error:ee},{data:notes,error:ne},{data:reviews,error:re}]=await Promise.all([cloud.from('profiles').select('id,display_name,targets'),cloud.from('daily_entries').select('client_id,entry_date,payload'),role==='dietitian'?cloud.from('period_summaries').select('client_id,start_date,end_date,note'):Promise.resolve({data:[]}),cloud.from('entry_reviews').select('client_id,entry_date,feedback,reviewed_at')]);if(pe||ee||ne||re)throw(pe||ee||ne||re);data.clients=(profiles||[]).map(p=>({id:p.id,name:p.display_name||'個案',targets:p.targets||{'一般日':defaultTargets}}));const reviewMap=new Map((reviews||[]).map(r=>[r.client_id+'|'+r.entry_date,r]));data.entries=(rows||[]).map(r=>{const review=reviewMap.get(r.client_id+'|'+r.entry_date);return {...r.payload,clientId:r.client_id,date:r.entry_date,feedback:review?.feedback||'',reviewedAt:review?.reviewed_at||'',status:review?'reviewed':r.payload.status};});data.summaries={};(notes||[]).forEach(n=>data.summaries[`${n.client_id}|${n.start_date}|${n.end_date}`]=n.note);if(role==='client')person=currentUser.id;else if(!data.clients.some(c=>c.id===person))person=data.clients[0]?.id||''}
async function persistEntry(e){if(role==='dietitian'){const {error}=await cloud.from('entry_reviews').upsert({client_id:e.clientId,entry_date:e.date,dietitian_id:currentUser.id,feedback:e.feedback||'',reviewed_at:new Date().toISOString()},{onConflict:'client_id,entry_date'});if(error)throw error;return;}let payload={...e};for(const k of ['clientId','date','feedback','reviewedAt'])delete payload[k];if(payload.status==='reviewed')payload.status='submitted';let {error}=await cloud.from('daily_entries').upsert({client_id:e.clientId,entry_date:e.date,payload},{onConflict:'client_id,entry_date'});if(error)throw error}
async function persistTargets(){let c=client();let {error}=await cloud.from('profiles').update({targets:c.targets}).eq('id',c.id);if(error)throw error}
async function persistSummary(){let note=$('periodNote').value;data.summaries[`${person}|${summaryStart}|${summaryEnd}`]=note;let {error}=await cloud.from('period_summaries').upsert({client_id:person,start_date:summaryStart,end_date:summaryEnd,note},{onConflict:'client_id,start_date,end_date'});if(error)throw error}
async function signOut(){await cloud.auth.signOut();location.reload()}
function clearConfig(){localStorage.removeItem(CONFIG_KEY);location.reload()}
init();
</script></body></html>
