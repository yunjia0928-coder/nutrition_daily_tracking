<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>營養紀錄｜個案日誌</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#24332e;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}header{background:#315e4c;color:white;padding:24px;border-radius:18px;margin-bottom:20px}h1{margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}.sub{opacity:.85}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:white;border:1px solid #e1e9e2;border-radius:16px;padding:20px;margin-bottom:16px}label{display:block;font-size:14px;font-weight:600;margin:10px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cad6cd;border-radius:9px;font:inherit;background:white}textarea{min-height:80px;resize:vertical}button{border:0;background:#315e4c;color:white;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}button.secondary{background:#e4eee7;color:#315e4c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.foodrow{display:grid;grid-template-columns:minmax(125px,2fr) 1fr 1fr 1fr;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #edf1ed}.foodrow input{min-width:0}.status{font-size:13px;font-weight:700}.ok{color:#21824b}.low{color:#bd7924}.high{color:#bf4949}.muted{color:#68796e;font-size:13px}.summary{white-space:pre-wrap;background:#f4f7f3;padding:16px;border-radius:12px;line-height:1.7}.metric{background:#f4f7f3;padding:14px;border-radius:12px}.metric b{display:block;font-size:22px;color:#315e4c}@media(max-width:520px){.wrap{padding:12px}.foodrow{grid-template-columns:1.4fr .8fr .8fr .8fr;font-size:12px}.foodrow input{padding:7px}.card{padding:14px}}</style></head><body><main class="wrap"><header><h1>🌿 我的營養日誌</h1><div class="sub">每日飲食・食物份數・生活習慣追蹤</div></header><section class="card"><h2>基本資料</h2><div class="grid"><div><label>個案名稱／暱稱</label><input id="client" placeholder="例如：小明"></div><div><label>紀錄日期</label><input id="date" type="date"></div><div><label>飲食日類型</label><select id="daytype"><option>一般日</option><option>中碳日 M+</option><option>中碳日 M</option><option>低碳日 L</option><option>高碳日 H</option><option>運動日</option><option>休息日</option></select></div></div></section><section class="card"><h2>食物份數追蹤</h2><p class="muted">目標可依營養師提供的個人化餐盤調整。實際攝取量可輸入小數。</p><div class="foodrow"><b>食物類別</b><b>目標</b><b>實際</b><b>狀態</b></div><div id="foods"></div></section><section class="card"><h2>每日餐食</h2><div class="grid"><div><label>早餐</label><textarea id="breakfast" placeholder="食物、份量、時間"></textarea></div><div><label>午餐</label><textarea id="lunch"></textarea></div><div><label>晚餐</label><textarea id="dinner"></textarea></div><div><label>點心／飲料／補充品</label><textarea id="snack"></textarea></div></div></section><section class="card"><h2>生活與活動紀錄</h2><div class="grid"><div><label>體重 (kg)</label><input id="weight" type="number" step="0.1" min="0"></div><div><label>飲水量 (ml)</label><input id="water" type="number" min="0"></div><div><label>步數</label><input id="steps" type="number" min="0"></div><div><label>睡眠 (小時)</label><input id="sleep" type="number" step="0.5" min="0"></div><div><label>排便狀況</label><select id="bowel"><option value="">未填寫</option><option>正常</option><option>便秘</option><option>腹瀉</option><option>其他</option></select></div><div><label>運動項目／時間</label><input id="exercise" placeholder="重訓 60 分鐘"></div></div><label>飢餓感、聚餐、心情或其他備註</label><textarea id="notes"></textarea></section><section class="card"><h2>今日摘要</h2><div class="grid"><div class="metric">已填寫份數類別<b id="filled">0 / 10</b></div><div class="metric">達標類別（依設定目標）<b id="achieved">0</b></div></div><div id="summary" class="summary" style="margin-top:16px"></div><div class="actions"><button id="save">儲存當日紀錄</button><button id="copy" class="secondary">複製摘要</button><button id="export" class="secondary">匯出全部紀錄 JSON</button><button id="csv" class="secondary">匯出全部紀錄 CSV</button></div><p class="muted">紀錄僅儲存在此瀏覽器的本機儲存空間，不會自動同步至營養師。換裝置、清除網站資料或使用無痕模式可能遺失紀錄；請定期匯出備份。</p><div id="message" role="status" class="muted"></div></section></main><script>
const categories=['蔬菜','全穀雜糧','低脂豆魚蛋肉','中脂豆魚蛋肉','高脂豆魚蛋肉','油脂','水果','乳品','高蛋白','其他'];const key='nutrition_diary_v1';const $=id=>document.getElementById(id);const fields=['client','date','daytype','breakfast','lunch','dinner','snack','weight','water','steps','sleep','bowel','exercise','notes'];let records={};try{records=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{records={}}const pad=n=>String(n).padStart(2,'0');const d=new Date();$('date').value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const foodbox=$('foods');categories.forEach((name,i)=>{const row=document.createElement('div');row.className='foodrow';const title=document.createElement('span');title.textContent=name;row.append(title);for(const part of ['target','actual']){const el=document.createElement('input');el.type='number';el.min='0';el.step='0.1';el.placeholder='—';el.id=`${part}${i}`;el.setAttribute('aria-label',`${name}${part==='target'?'目標':'實際'}份數`);row.append(el)}const status=document.createElement('span');status.id=`status${i}`;status.className='status';row.append(status);foodbox.append(row)});function snapshot(){const r={};fields.forEach(k=>r[k]=$(k).value);r.foods=categories.map((name,i)=>({name,target:$('target'+i).value,actual:$('actual'+i).value}));return r}function restore(r){fields.forEach(k=>{if(k!=='date')$(k).value=r?.[k]??''});categories.forEach((_,i)=>{for(const part of ['target','actual'])$(part+i).value=r?.foods?.[i]?.[part]??''});update()}function loadDate(){const date=$('date').value;restore(records[date]);$('date').value=date;$('message').textContent=records[date]?'已載入當日紀錄':'此日期尚無儲存紀錄'}function summaryText(){const r=snapshot();const lines=[`【${r.date}｜${r.client||'個案'}｜${r.daytype}】`,'','🍽 食物份數（實際 / 目標）'];r.foods.forEach(f=>{if(f.actual!==''||f.target!=='')lines.push(`${f.name}：${f.actual||'未填'} / ${f.target||'未設定'} 份`)});lines.push('','📋 餐食紀錄',`早餐：${r.breakfast||'—'}`,`午餐：${r.lunch||'—'}`,`晚餐：${r.dinner||'—'}`,`點心：${r.snack||'—'}`,'','🏃 生活紀錄',`體重：${r.weight||'—'} kg｜飲水：${r.water||'—'} ml｜步數：${r.steps||'—'}`,`睡眠：${r.sleep||'—'} 小時｜排便：${r.bowel||'—'}`,`運動：${r.exercise||'—'}`,`備註：${r.notes||'—'}`);return lines.join('\n')}function update(){let filled=0,achieved=0;categories.forEach((_,i)=>{const t=$('target'+i).value,a=$('actual'+i).value,s=$('status'+i);s.className='status';s.textContent='—';if(a!=='')filled++;if(t!==''&&a!==''){const diff=Number(a)-Number(t);if(Math.abs(diff)<0.001){s.textContent='達標';s.classList.add('ok');achieved++}else if(diff<0){s.textContent='不足 '+Math.abs(diff).toFixed(1);s.classList.add('low')}else{s.textContent='超出 +'+diff.toFixed(1);s.classList.add('high')}}});$('filled').textContent=`${filled} / ${categories.length}`;$('achieved').textContent=achieved;$('summary').textContent=summaryText()}document.querySelectorAll('input,textarea,select').forEach(el=>{if(el.id==='date')el.addEventListener('change',loadDate);else el.addEventListener('input',update)});$('save').onclick=()=>{if(!$('date').value)return;records[$('date').value]=snapshot();try{localStorage.setItem(key,JSON.stringify(records));$('message').textContent='已儲存至此瀏覽器'}catch{$('message').textContent='儲存失敗：瀏覽器可能已達容量限制'}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summaryText());$('message').textContent='摘要已複製'}catch{$('message').textContent='複製失敗，請手動選取摘要'}};function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=()=>download(JSON.stringify(records,null,2),'nutrition-records.json','application/json');$('csv').onclick=()=>{const head=['日期',...fields.filter(f=>f!=='date'),...categories.flatMap(c=>[c+'目標',c+'實際'])];const esc=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=Object.entries(records).map(([date,r])=>[date,...fields.filter(f=>f!=='date').map(f=>r[f]),...categories.flatMap((_,i)=>[r.foods?.[i]?.target,r.foods?.[i]?.actual])]);download('\ufeff'+[head,...rows].map(row=>row.map(esc).join(',')).join('\r\n'),'nutrition-records.csv','text/csv;charset=utf-8')};loadDate();</script></body></html>
